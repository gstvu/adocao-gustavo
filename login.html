<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção - Tela de Login</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="back-secundario">

    <div align="center">
        <div class="content" align="left">
            <h1 class="title-2" style="margin-top: 10vh;">Login!</h1>
            <p class="text-info-2" style="font-weight: 300; margin-top:-10px" >Preencha com suas credenciais para logar.</p>
            
            <form action="" class="top7">
                <input type="text" class="input-1" placeholder="Email" required>
                <input type="password" class="input-1 top3" placeholder="Senha" required>

                <div align="right">
                    <p class="text-info-2">Esqueceu sua senha?</p>
                </div>

                <button class="btn-login top4">Log In</button>
            </form>
            
            <div>
                <p class="text-info-2">Não possuo uma conta, <a href="">Criar uma conta</a></p>
            </div>

        </div>

        <div align="center" class="footer-info">
            <p class="text-info-2" style="font-size: 12px !important;width: 60%;">Ao fazer login, eu concordo com os <a href="">termos de uso</a> e <a href="">política de privacidade</a>.</p>
        </div>
    </div>

</body>

</html>
